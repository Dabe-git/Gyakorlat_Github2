name: Go checks

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check linking
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...